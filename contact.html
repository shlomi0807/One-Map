<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

    <div id="mySidenav" class="sidenav">
        <div id="search">
            <input id="search-input" type="search" placeholder="search">
            <span class="fa fa-search"></span>
        </div>
        <a href="index.html" id="Map-nav">Map<i class="fa fa-map-o"></i></a>
        <a href="characters.html" id="characters">characters<img src="images/characters-icon.png"
                class="characters-icon"></a>
        <a href="places.html" id="Places">Places<i class="fa fa-map-marker"></i></a>
        <a href="contact.html" id="contact">Contact us<i class="fa fa-fw fa-envelope"></i></a>
    </div>


    <div class="container">
  <form action="">

    <label for="fname">Name</label>
    <input type="text" id="fname" name="fullname" placeholder="Your name..">

    <label for="email">Email</label>
    <input type="text" id="email" name="email" placeholder="Your email.." pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" 
                oninvalid="this.setCustomValidity('Please enter a valid email address')" oninput="this.setCustomValidity('')">

    <label for="reqtype">Type of Request *</label>
    <select id="reqtype" name="reqtype" required>
        <option value="" disabled selected >choose one..</option>
        <option value="bugrep">Bug Report</option>
        <option value="suggestion">Feature Suggestion</option>
        <option value="wrong">Wrong Information</option>
        <option value="feedback">General Feedback</option>
        <option value="contact">Contact</option>
        <option value="Other">Other</option>
    </select>

    <label for="subject">Subject *<div id="char-warning" class="warning-text">You have reached the maximum character limit.</div>
    </label>
    
    <textarea id="subject" name="subject" placeholder="Write something.." style="height:200px" maxlength="1000" required></textarea>
     
    <input type="submit" value="Submit">
   
  </form>
</div>

<div id="success-popup" class="popup-overlay">
    <div class="popup-content">
        <h2>Success!</h2>
        <p>Your message has been sent successfully.</p>
        <button id="close-popup">Close</button>
    </div>
</div>

<script src="JS/contact.js"></script>

</body>

</html>
