<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="icon" href="images/one-map-logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

    <div id="page-overlay"></div>
    <span style="font-size:30px;cursor:pointer" id="open-nav-btn">&#9776;</span>

    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" id="close-nav-btn">&times;</a>
        <a href="index.html" id="Map-nav"><i class="fa fa-map-o"></i> Map</a>
        <a href="characters.html" id="characters"><img src="images/characters-icon.png" class="characters-icon"> characters</a>
        <a href="places.html" id="Places"><i class="fa fa-map-marker"></i> Places</a>
        <a href="contact.html" id="contact"><i class="fa fa-fw fa-envelope"></i> Contact us</a>
    </div>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 contact-card">
                
                <form action="">
                    <div class="mb-3">
                        <label for="fname" class="form-label">Name</label>
                        <input type="text" id="fname" name="fullname" class="form-control custom-input" placeholder="Your name..">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control custom-input" placeholder="Your email.." pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" 
                            oninvalid="this.setCustomValidity('Please enter a valid email address')" oninput="this.setCustomValidity('')">
                    </div>

                    <div class="mb-3">
                        <label for="reqtype" class="form-label">Type of Request *</label>
                        <select id="reqtype" name="reqtype" class="form-select custom-input" required
                        oninvalid="this.setCustomValidity('Please choose a type of request')" oninput="this.setCustomValidity('')">
                            <option value="" disabled selected>choose one..</option>
                            <option value="bugrep">Bug Report</option>
                            <option value="suggestion">Feature Suggestion</option>
                            <option value="wrong">Wrong Information</option>
                            <option value="feedback">General Feedback</option>
                            <option value="contact">Contact</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label d-flex justify-content-between align-items-center">
                            <span>Subject *</span>
                            <span id="char-warning" class="warning-text mb-0 text-end">You have reached the maximum character limit.</span>
                        </label>
                        <textarea id="subject" name="subject" class="form-control custom-input" placeholder="Write something.." style="height:200px" maxlength="1000" required
                            oninvalid="this.setCustomValidity('Please enter a subject')" oninput="this.setCustomValidity('')"></textarea>
                    </div>
                
                    <button type="submit" class="btn w-100 custom-submit">Submit</button>
                </form>

            </div>
        </div>
    </div>

    <div id="success-popup" class="popup-overlay">
        <div class="popup-content">
            <h2>Success!</h2>
            <p>Your message has been sent successfully.</p>
            <button id="close-popup" class="btn custom-submit">Close</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="JS/contact.js"></script>
    <script src="JS/global.js"></script>
</body>
</html>
